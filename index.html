<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер английских слов</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            padding: 20px 0; /* Добавили отступ для скролла, если блоков станет много */
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            max-height: 95vh;
            overflow-y: auto; /* Добавили скролл внутри карточки, если экран маленький */
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        h2 {
            font-size: 26px;
            margin-bottom: 25px;
            color: var(--primary);
        }

        /* Дизайн меню */
        .block-container {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .block-title {
            font-size: 15px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Общие кнопки */
        button {
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #menu-screen button {
            justify-content: flex-start;
        }

        button:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f5f3ff;
            color: var(--primary);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button.correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
        }

        button.incorrect {
            background-color: var(--danger) !important;
            border-color: var(--danger) !important;
            color: white !important;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Прогресс бар */
        .progress-wrapper {
            margin-bottom: 25px;
        }
        
        .progress-bar {
            height: 8px;
            background-color: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* Режим письма */
        #typing-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.2s ease;
            outline: none;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input[type="text"].correct-input {
            border-color: var(--success);
            background-color: #ecfdf5;
            color: #065f46;
        }

        input[type="text"].incorrect-input {
            border-color: var(--danger);
            background-color: #fef2f2;
            color: #991b1b;
        }

        .typing-actions {
            display: flex;
            gap: 10px;
        }

        .typing-actions button {
            flex: 1;
            margin: 0;
            justify-content: center;
        }

        /* Утилиты */
        .hidden { display: none !important; }

        /* Экран результатов */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .val-correct { color: var(--success); }
        .val-incorrect { color: var(--danger); }

        #mistakes-list {
            font-size: 15px;
            color: var(--danger);
            max-height: 220px;
            overflow-y: auto;
            padding-left: 0;
            list-style: none;
            background: #fef2f2;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            border: 1px solid #fecaca;
        }

        #mistakes-list li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #fecaca;
        }
        #mistakes-list li:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        #mistakes-list span { color: var(--text-main); font-weight: bold; }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            color: white;
        }
        
        .back-top-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
            font-weight: 600;
            display: inline-block;
        }
        .back-top-btn:hover:not(:disabled) {
            color: var(--text-main);
            background: none;
            border: none;
            transform: none;
        }
        
        /* Стилизация скроллбара */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-screen">
        <h1>Выберите тренировку</h1>
        
        <div class="block-container">
            <div class="block-title">Блок 1 (Первые 60 слов)</div>
            <div class="options">
                <button id="btn-b1-std">🎯 Англ ➔ Рус (Выбор)</button>
                <button id="btn-b1-rev">🔄 Рус ➔ Англ (Реверс)</button>
                <button id="btn-b1-write">✍️ Письмо (Напиши сам)</button>
            </div>
        </div>

        <div class="block-container">
            <div class="block-title">Блок 2 (58 слов)</div>
            <div class="options">
                <button id="btn-b2-std">🎯 Англ ➔ Рус (Выбор)</button>
                <button id="btn-b2-rev">🔄 Рус ➔ Англ (Реверс)</button>
                <button id="btn-b2-write">✍️ Письмо (Напиши сам)</button>
            </div>
        </div>

        <div class="block-container">
            <div class="block-title">Блок 3 (Новые 59 слов)</div>
            <div class="options">
                <button id="btn-b3-std">🎯 Англ ➔ Рус (Выбор)</button>
                <button id="btn-b3-rev">🔄 Рус ➔ Англ (Реверс)</button>
                <button id="btn-b3-write">✍️ Письмо (Напиши сам)</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <button id="back-from-quiz-btn" class="back-top-btn">← Вернуться в меню</button>
        
        <div class="progress-wrapper">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">1 / X</div>
        </div>

        <h2 id="word-display">Word</h2>
        
        <div class="options" id="options-container"></div>

        <div id="typing-container" class="hidden">
            <input type="text" id="typing-input" autocomplete="off" placeholder="Введите слово на английском...">
            <div class="typing-actions">
                <button id="btn-dont-know">Не знаю</button>
                <button id="btn-check-typing" class="btn-primary">Проверить</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Тренировка завершена! 🏆</h2>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Правильно</div>
                <div class="stat-value val-correct" id="score-correct">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Ошибок</div>
                <div class="stat-value val-incorrect" id="score-incorrect">0</div>
            </div>
        </div>
        
        <div id="mistakes-container" class="hidden">
            <p style="text-align: left; font-weight: bold; margin-bottom: 10px; color: #1e293b;">Слова для повторения:</p>
            <ul id="mistakes-list"></ul>
        </div>

        <button id="restart-btn" class="btn-primary" style="width: 100%; margin-bottom: 10px;">Повторить этот тест</button>
        <button id="back-menu-btn" style="width: 100%; justify-content: center;">В главное меню</button>
    </div>
</div>

    let activeDataPool = [];
    let shuffledQuizData = [];
    let currentWordIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let mistakes = [];
    let timeoutId = null;
    let currentTestMode = 'standard'; // 'standard', 'reverse', 'typing'

    const menuScreen = document.getElementById('menu-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const wordDisplay = document.getElementById('word-display');
    const optionsContainer = document.getElementById('options-container');
    const typingContainer = document.getElementById('typing-container');
    const typingInput = document.getElementById('typing-input');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function cleanWord(word) {
        return word.replace(/\s*\(.*?\)\s*/g, '').toLowerCase().trim();
    }

    function getOptionsForWord(currentData, dataPool, isReverse) {
        if (!isReverse && currentData.options) return currentData.options;
        const targetProp = isReverse ? 'word' : 'answer';
        const correctValue = currentData[targetProp];
        let optionsSet = new Set([correctValue]);
        
        while(optionsSet.size < 4) {
            let randomWord = dataPool[Math.floor(Math.random() * dataPool.length)];
            optionsSet.add(randomWord[targetProp]);
        }
        return Array.from(optionsSet);
    }

    function showMenu() {
        if (timeoutId) clearTimeout(timeoutId);
        menuScreen.classList.remove('hidden');
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
    }

    function updateProgress() {
        progressText.textContent = `${currentWordIndex + 1} / ${shuffledQuizData.length}`;
        const percentage = ((currentWordIndex) / shuffledQuizData.length) * 100;
        progressFill.style.width = `${percentage}%`;
    }

    function startTest(dataArray, mode) {
        activeDataPool = dataArray;
        currentTestMode = mode;
        currentWordIndex = 0;
        correctCount = 0;
        incorrectCount = 0;
        mistakes = [];
        
        shuffledQuizData = shuffleArray(activeDataPool);
        
        menuScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        loadWord();
    }

    function loadWord() {
        if (currentWordIndex >= shuffledQuizData.length) {
            showResults();
            return;
        }

        updateProgress();
        const currentData = shuffledQuizData[currentWordIndex];
        
        optionsContainer.innerHTML = '';
        typingInput.value = '';
        typingInput.className = '';
        typingInput.disabled = false;
        
        if (currentTestMode === 'standard' || currentTestMode === 'reverse') {
            optionsContainer.classList.remove('hidden');
            typingContainer.classList.add('hidden');
            
            const isReverse = currentTestMode === 'reverse';
            wordDisplay.textContent = isReverse ? currentData.answer : currentData.word;
            
            const rawOptions = getOptionsForWord(currentData, activeDataPool, isReverse);
            const shuffledOptions = shuffleArray(rawOptions);

            shuffledOptions.forEach(optionText => {
                const btn = document.createElement('button');
                btn.textContent = optionText;
                btn.onclick = () => checkAnswerStandard(btn, optionText, currentData, isReverse);
                optionsContainer.appendChild(btn);
            });

        } else if (currentTestMode === 'typing') {
            optionsContainer.classList.add('hidden');
            typingContainer.classList.remove('hidden');
            wordDisplay.textContent = currentData.answer; 
            
            setTimeout(() => typingInput.focus(), 100);
        }
    }

    function checkAnswerStandard(buttonElement, selectedText, currentData, isReverse) {
        const allButtons = optionsContainer.querySelectorAll('button');
        allButtons.forEach(btn => btn.disabled = true);

        const correctAnswer = isReverse ? currentData.word : currentData.answer;
        const isCorrect = selectedText === correctAnswer;

        if (isCorrect) {
            buttonElement.classList.add('correct');
            correctCount++;
        } else {
            buttonElement.classList.add('incorrect');
            incorrectCount++;
            mistakes.push(`<span>${currentData.word}</span> — ${currentData.answer}`);
        }
        
        timeoutId = setTimeout(() => { currentWordIndex++; loadWord(); }, 700);
    }

    function handleTypingAnswer(isSkip = false) {
        if (typingInput.disabled) return;
        
        const currentData = shuffledQuizData[currentWordIndex];
        const userAnswer = cleanWord(typingInput.value);
        const correctAnswerClean = cleanWord(currentData.word);
        
        typingInput.disabled = true;

        if (!isSkip && userAnswer === correctAnswerClean) {
            typingInput.classList.add('correct-input');
            correctCount++;
        } else {
            typingInput.classList.add('incorrect-input');
            incorrectCount++;
            mistakes.push(`<span>${currentData.word}</span> — ${currentData.answer}`);
        }
        
        timeoutId = setTimeout(() => { currentWordIndex++; loadWord(); }, 700);
    }

    document.getElementById('btn-check-typing').addEventListener('click', () => handleTypingAnswer(false));
    document.getElementById('btn-dont-know').addEventListener('click', () => handleTypingAnswer(true));
    
    typingInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleTypingAnswer(false);
        }
    });

    function showResults() {
        progressFill.style.width = `100%`;
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        document.getElementById('score-correct').textContent = correctCount;
        document.getElementById('score-incorrect').textContent = incorrectCount;

        const mistakesContainer = document.getElementById('mistakes-container');
        const mistakesList = document.getElementById('mistakes-list');
        
        if (mistakes.length > 0) {
            mistakesContainer.classList.remove('hidden');
            mistakesList.innerHTML = mistakes.map(m => `<li>${m}</li>`).join('');
        } else {
            mistakesContainer.classList.add('hidden');
        }
    }

    // Блок 1
    document.getElementById('btn-b1-std').addEventListener('click', () => startTest(quizData1, 'standard'));
    document.getElementById('btn-b1-rev').addEventListener('click', () => startTest(quizData1, 'reverse'));
    document.getElementById('btn-b1-write').addEventListener('click', () => startTest(quizData1, 'typing'));

    document.getElementById('btn-b2-rev').addEventListener('click', () => startTest(quizData2, 'reverse'));
    document.getElementById('btn-b2-write').addEventListener('click', () => startTest(quizData2, 'typing'));
    
    // Блок 3
    document.getElementById('btn-b3-std').addEventListener('click', () => startTest(quizData3, 'standard'));
    document.getElementById('btn-b3-rev').addEventListener('click', () => startTest(quizData3, 'reverse'));
    document.getElementById('btn-b3-write').addEventListener('click', () => startTest(quizData3, 'typing'));
    
    // Навигация
    document.getElementById('back-menu-btn').addEventListener('click', showMenu);
    document.getElementById('back-from-quiz-btn').addEventListener('click', showMenu);
    
    document.getElementById('restart-btn').addEventListener('click', () => startTest(activeDataPool, currentTestMode));

</script>
