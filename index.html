<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер английских слов PRO</title>
    <style>
        :root {
            --primary: #6366f1; /* Индиго */
            --secondary: #8b5cf6; /* Фиолетовый для карточек */
            --success: #10b981;
            --danger: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            padding: 20px 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            max-height: 95vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 30px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 25px;
            color: var(--primary);
        }

        /* Дизайн меню */
        .block-container {
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .block-title {
            font-size: 16px;
            color: var(--primary);
            text-align: center;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        /* Общие кнопки */
        button {
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background-color: var(--card-bg);
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-flash {
            background-color: #f5f3ff;
            border-color: #ddd6fe;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        button.correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
        }

        button.incorrect {
            background-color: var(--danger) !important;
            border-color: var(--danger) !important;
            color: white !important;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Прогресс бар */
        .progress-wrapper {
            margin-bottom: 30px;
        }
        
        .progress-bar {
            height: 10px;
            background-color: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        /* Режим карточек (Flashcards) - Анимация переворота сохранена */
        .flashcard-container {
            perspective: 1000px;
            margin-bottom: 25px;
            height: 220px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            font-size: 28px;
            font-weight: bold;
        }

        .flashcard-front {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
        }

        .flashcard-back {
            background-color: white;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            transform: rotateY(180deg);
            font-size: 22px;
        }
        
        .flashcard-hint {
            position: absolute;
            bottom: 15px;
            font-size: 13px;
            opacity: 0.7;
            font-weight: normal;
        }

        /* Режим письма */
        #typing-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            box-sizing: border-box;
            text-align: center;
            outline: none;
            color: var(--text-main);
            font-weight: 600;
        }

        input[type="text"].correct-input {
            border-color: var(--success);
            background-color: #ecfdf5;
            color: #065f46;
        }

        input[type="text"].incorrect-input {
            border-color: var(--danger);
            background-color: #fef2f2;
            color: #991b1b;
        }

        .typing-actions {
            display: flex;
            gap: 10px;
        }

        .typing-actions button {
            flex: 1;
            margin: 0;
            justify-content: center;
        }

        /* Утилиты */
        .hidden { display: none !important; }

        /* Экран результатов */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            background: #f8fafc;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;}
        .stat-value { font-size: 36px; font-weight: 800; }
        .val-correct { color: var(--success); }
        .val-incorrect { color: var(--danger); }

        #mistakes-list {
            font-size: 16px;
            color: var(--danger);
            max-height: 200px;
            overflow-y: auto;
            padding-left: 0;
            list-style: none;
            background: #fef2f2;
            padding: 20px;
            border-radius: 16px;
            text-align: left;
            border: 1px solid #fecaca;
        }

        #mistakes-list li {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #fca5a5;
        }
        #mistakes-list li:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        #mistakes-list span { color: var(--text-main); font-weight: 700; }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn-review {
            background-color: #fbbf24;
            color: #78350f;
            border: none;
            font-weight: bold;
        }
        
        .back-top-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            padding: 0;
            margin-bottom: 25px;
            text-align: left;
            width: 100%;
            font-weight: 700;
            display: inline-block;
        }
        
        /* Стилизация скроллбара */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-screen">
        <h1>Тренажер английских слов</h1>
        
        <div class="block-container">
            <div class="block-title">Блок 1 (Первые 60 слов)</div>
            <div class="options">
                <button class="btn-flash" onclick="startFlashcards(quizData1)">🃏 Карточки (Изучение)</button>
                <button onclick="startTest(quizData1, 'standard')">🎯 Англ ➔ Рус</button>
                <button onclick="startTest(quizData1, 'reverse')">🔄 Рус ➔ Англ</button>
                <button onclick="startTest(quizData1, 'typing')">✍️ Письмо</button>
            </div>
        </div>

        <div class="block-container">
            <div class="block-title">Блок 2 (58 слов)</div>
            <div class="options">
                <button class="btn-flash" onclick="startFlashcards(quizData2)">🃏 Карточки (Изучение)</button>
                <button onclick="startTest(quizData2, 'standard')">🎯 Англ ➔ Рус</button>
                <button onclick="startTest(quizData2, 'reverse')">🔄 Рус ➔ Англ</button>
                <button onclick="startTest(quizData2, 'typing')">✍️ Письмо</button>
            </div>
        </div>

        <div class="block-container">
            <div class="block-title">Блок 3 (59 слов)</div>
            <div class="options">
                <button class="btn-flash" onclick="startFlashcards(quizData3)">🃏 Карточки (Изучение)</button>
                <button onclick="startTest(quizData3, 'standard')">🎯 Англ ➔ Рус</button>
                <button onclick="startTest(quizData3, 'reverse')">🔄 Рус ➔ Англ</button>
                <button onclick="startTest(quizData3, 'typing')">✍️ Письмо</button>
            </div>
        </div>

        <div class="block-container">
            <div class="block-title">Блок 4 (Новые 60 слов)</div>
            <div class="options">
                <button class="btn-flash" onclick="startFlashcards(quizData4)">🃏 Карточки (Изучение)</button>
                <button onclick="startTest(quizData4, 'standard')">🎯 Англ ➔ Рус</button>
                <button onclick="startTest(quizData4, 'reverse')">🔄 Рус ➔ Англ</button>
                <button onclick="startTest(quizData4, 'typing')">✍️ Письмо</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <button id="back-from-quiz-btn" class="back-top-btn">← В главное меню</button>
        
        <div class="progress-wrapper">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">1 / X</div>
        </div>

        <div id="test-mode-container">
            <h2 id="word-display">Word</h2>
            <div class="options" id="options-container"></div>
            <div id="typing-container" class="hidden">
                <input type="text" id="typing-input" autocomplete="off" placeholder="Напиши на английском...">
                <div class="typing-actions">
                    <button id="btn-dont-know">Не знаю</button>
                    <button id="btn-check-typing" class="btn-primary">Проверить</button>
                </div>
            </div>
        </div>

        <div id="flashcard-mode-container" class="hidden">
            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <span id="fc-front-text">Word</span>
                        <div class="flashcard-hint">Нажми, чтобы перевернуть</div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <span id="fc-back-text">Перевод</span>
                    </div>
                </div>
            </div>
            <button id="btn-next-flashcard" class="btn-primary" style="width: 100%;">Следующее слово →</button>
        </div>

    </div>

    <div id="result-screen" class="hidden">
        <h2>Тренировка завершена! 🏆</h2>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Правильно</div>
                <div class="stat-value val-correct" id="score-correct">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Ошибок</div>
                <div class="stat-value val-incorrect" id="score-incorrect">0</div>
            </div>
        </div>
        
        <div id="mistakes-container" class="hidden">
            <p style="text-align: left; font-weight: bold; margin-bottom: 10px; color: #1e293b;">Нужно повторить:</p>
            <ul id="mistakes-list"></ul>
            <button id="btn-review-mistakes" class="btn-review" style="width: 100%; margin-bottom: 15px;">🔁 Отработать ошибки</button>
        </div>

        <button id="restart-btn" class="btn-primary" style="width: 100%; margin-bottom: 10px;">Повторить этот тест заново</button>
        <button id="back-menu-btn" class="btn-primary" style="width: 100%; justify-content: center; background-color: var(--card-bg); color: var(--text-main); border: 2px solid var(--border-color);">В главное меню</button>
    </div>
</div>

<script>

    // --- ДАННЫЕ ДЛЯ БЛОКА 2 ---
    const quizData2 = [

    let activeDataPool = [];
    let shuffledQuizData = [];
    let currentWordIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let mistakesTextList = [];
    let mistakesDataObj = []; 
    let timeoutId = null;
    let currentTestMode = 'standard'; 

    const menuScreen = document.getElementById('menu-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    
    // Элементы режима проверки
    const testModeContainer = document.getElementById('test-mode-container');
    const wordDisplay = document.getElementById('word-display');
    const optionsContainer = document.getElementById('options-container');
    const typingContainer = document.getElementById('typing-container');
    const typingInput = document.getElementById('typing-input');
    
    // Элементы режима карточек
    const flashcardModeContainer = document.getElementById('flashcard-mode-container');
    const flashcardElement = document.getElementById('flashcard');
    const fcFrontText = document.getElementById('fc-front-text');
    const fcBackText = document.getElementById('fc-back-text');
    
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function cleanWord(word) {
        return word.replace(/\s*\(.*?\)\s*/g, '').toLowerCase().trim();
    }

    function getOptionsForWord(currentData, dataPool, isReverse) {
        if (!isReverse && currentData.options) return currentData.options;
        const targetProp = isReverse ? 'word' : 'answer';
        const correctValue = currentData[targetProp];
        let optionsSet = new Set([correctValue]);
        
        while(optionsSet.size < 4) {
            let randomWord = dataPool[Math.floor(Math.random() * dataPool.length)];
            if(randomWord[targetProp]) optionsSet.add(randomWord[targetProp]);
        }
        return Array.from(optionsSet);
    }

    function showMenu() {
        if (timeoutId) clearTimeout(timeoutId);
        menuScreen.classList.remove('hidden');
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
    }

    function updateProgress() {
        progressText.textContent = `${currentWordIndex + 1} / ${shuffledQuizData.length}`;
        const percentage = ((currentWordIndex) / shuffledQuizData.length) * 100;
        progressFill.style.width = `${percentage}%`;
    }

    // --- ЛОГИКА КАРТОЧЕК ---
    function startFlashcards(dataArray) {
        activeDataPool = dataArray;
        currentTestMode = 'flashcard';
        currentWordIndex = 0;
        shuffledQuizData = shuffleArray(activeDataPool);
        
        menuScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        testModeContainer.classList.add('hidden');
        flashcardModeContainer.classList.remove('hidden');
        
        loadFlashcard();
    }

    function loadFlashcard() {
        if (currentWordIndex >= shuffledQuizData.length) {
            showMenu();
            return;
        }
        
        updateProgress();
        flashcardElement.classList.remove('flipped');
        
        const currentData = shuffledQuizData[currentWordIndex];
        fcFrontText.textContent = currentData.word;
        fcBackText.textContent = currentData.answer;
    }

    function flipCard() {
        flashcardElement.classList.toggle('flipped');
    }

    document.getElementById('btn-next-flashcard').addEventListener('click', () => {
        currentWordIndex++;
        loadFlashcard();
    });

    // --- ЛОГИКА ТЕСТИРОВАНИЯ ---
    function startTest(dataArray, mode) {
        activeDataPool = dataArray;
        currentTestMode = mode;
        currentWordIndex = 0;
        correctCount = 0;
        incorrectCount = 0;
        mistakesTextList = [];
        mistakesDataObj = []; 
        
        shuffledQuizData = shuffleArray(activeDataPool);
        
        menuScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        flashcardModeContainer.classList.add('hidden');
        testModeContainer.classList.remove('hidden');
        
        loadWord();
    }

    function loadWord() {
        if (currentWordIndex >= shuffledQuizData.length) {
            showResults();
            return;
        }

        updateProgress();
        const currentData = shuffledQuizData[currentWordIndex];
        
        optionsContainer.innerHTML = '';
        typingInput.value = '';
        typingInput.className = '';
        typingInput.disabled = false;
        
        if (currentTestMode === 'standard' || currentTestMode === 'reverse') {
            optionsContainer.classList.remove('hidden');
            typingContainer.classList.add('hidden');
            
            const isReverse = currentTestMode === 'reverse';
            wordDisplay.textContent = isReverse ? currentData.answer : currentData.word;
            
            let poolForOptions = activeDataPool.length >= 4 ? activeDataPool : window['quizData' + (activeDataPool === mistakesDataObj ? "1" : "1")]; 
            if(activeDataPool.length < 4) {
               poolForOptions = [...activeDataPool, ...quizData1].slice(0, 4);
            }

            const rawOptions = getOptionsForWord(currentData, poolForOptions, isReverse);
            const shuffledOptions = shuffleArray(rawOptions);

            shuffledOptions.forEach(optionText => {
                const btn = document.createElement('button');
                btn.textContent = optionText;
                btn.onclick = () => checkAnswerStandard(btn, optionText, currentData, isReverse);
                optionsContainer.appendChild(btn);
            });

        } else if (currentTestMode === 'typing') {
            optionsContainer.classList.add('hidden');
            typingContainer.classList.remove('hidden');
            wordDisplay.textContent = currentData.answer; 
            
            setTimeout(() => typingInput.focus(), 100);
        }
    }

    function registerMistake(currentData) {
        incorrectCount++;
        mistakesTextList.push(`<span>${currentData.word}</span> — ${currentData.answer}`);
        if (!mistakesDataObj.includes(currentData)) {
            mistakesDataObj.push(currentData);
        }
    }

    function checkAnswerStandard(buttonElement, selectedText, currentData, isReverse) {
        const allButtons = optionsContainer.querySelectorAll('button');
        allButtons.forEach(btn => btn.disabled = true);

        const correctAnswer = isReverse ? currentData.word : currentData.answer;
        const isCorrect = selectedText === correctAnswer;

        if (isCorrect) {
            buttonElement.classList.add('correct');
            correctCount++;
        } else {
            buttonElement.classList.add('incorrect');
            registerMistake(currentData);
        }
        
        timeoutId = setTimeout(() => { currentWordIndex++; loadWord(); }, 700);
    }

    function handleTypingAnswer(isSkip = false) {
        if (typingInput.disabled) return;
        
        const currentData = shuffledQuizData[currentWordIndex];
        const userAnswer = cleanWord(typingInput.value);
        const correctAnswerClean = cleanWord(currentData.word);
        
        typingInput.disabled = true;

        if (!isSkip && userAnswer === correctAnswerClean) {
            typingInput.classList.add('correct-input');
            correctCount++;
        } else {
            typingInput.classList.add('incorrect-input');
            registerMistake(currentData);
        }
        
        timeoutId = setTimeout(() => { currentWordIndex++; loadWord(); }, 700);
    }

    document.getElementById('btn-check-typing').addEventListener('click', () => handleTypingAnswer(false));
    document.getElementById('btn-dont-know').addEventListener('click', () => handleTypingAnswer(true));
    
    typingInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleTypingAnswer(false);
        }
    });

    function showResults() {
        progressFill.style.width = `100%`;
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        document.getElementById('score-correct').textContent = correctCount;
        document.getElementById('score-incorrect').textContent = incorrectCount;

        const mistakesContainer = document.getElementById('mistakes-container');
        const mistakesList = document.getElementById('mistakes-list');
        const btnReviewMistakes = document.getElementById('btn-review-mistakes');
        
        if (mistakesTextList.length > 0) {
            mistakesContainer.classList.remove('hidden');
            mistakesList.innerHTML = mistakesTextList.map(m => `<li>${m}</li>`).join('');
            btnReviewMistakes.style.display = 'block';
        } else {
            mistakesContainer.classList.add('hidden');
            btnReviewMistakes.style.display = 'none';
        }
    }

    document.getElementById('btn-review-mistakes').addEventListener('click', () => {
        startTest(mistakesDataObj, currentTestMode);
    });

    document.getElementById('back-menu-btn').addEventListener('click', showMenu);
    document.getElementById('back-from-quiz-btn').addEventListener('click', showMenu);
    
    document.getElementById('restart-btn').addEventListener('click', () => startTest(activeDataPool, currentTestMode));

</script>
